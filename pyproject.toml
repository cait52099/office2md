[project]
name = "office2md"
version = "0.4.2"
description = "Convert Office, PDF, and text documents into structured, knowledge-base-ready Markdown"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["office", "pdf", "markdown", "docling", "markitdown", "knowledge-base", "rag"]
authors = [{name = "Hongwei Cai", email = "cait52099@gmail.com"}]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.0",
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "python-slugify>=8.0",
  "pymupdf>=1.24",
  "markitdown[all]",
  "docling",
]

[project.optional-dependencies]
gui = [
  "streamlit",
  "pyvis",
]
marker = [
  "marker-pdf",
]
dev = [
  "pytest",
  "ruff",
]

[project.scripts]
office2md = "office2md.cli:app"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["office2md*"]
exclude = ["tests*", "output*", "configs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
